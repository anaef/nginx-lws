daemon off;
worker_processes auto;
pid logs/nginx.pid;
lock_file logs/nginx.lock;

load_module modules/lws_module.so;

error_log logs/error.log info;

events {
	worker_connections 768;
}

http {
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	types_hash_max_size 2048;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	gzip on;

	access_log logs/access.log;
	error_log logs/error.log info;

	client_body_temp_path temp/client_body;
	fastcgi_temp_path temp/fastcgi;
	proxy_temp_path temp/proxy;
	scgi_temp_path temp/scgi;
	uwsgi_temp_path temp/uwsgi;

	server {
		listen 8080;
		server_name localhost;

		location / {
			alias /workspaces/nginx-lws/examples/static/;
		}

		location ~ /services/(\w+)(/.*)? {
			lws /workspaces/nginx-lws/examples/services/$1.lua $2;
			lws_init /workspaces/nginx-lws/examples/handlers/init.lua;
			lws_pre /workspaces/nginx-lws/examples/handlers/pre.lua;
			lws_path "+/workspaces/nginx-lws/examples/modules/?.lua;/workspaces/nginx-lws/examples/modules/?/init.lua";
			lws_error_response json diagnostic;
			lws_max_requests 512;
			lws_max_states 4;
			lws_timeout 10s;
			lws_max_memory 272K;
			lws_streaming on;
		}

		location /internal/ {
			alias /workspaces/nginx-lws/examples/internal/;
			internal;
		}

		location /lws-monitor/ {
			lws_monitor;
		}
	}
}
